<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>角色預覽 Unit Preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9fd3e8;
        font-family: system-ui, sans-serif;
      }
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #labels span {
        position: absolute;
        transform: translate(-50%, 0);
        font-size: 12px;
        color: #11141d;
        background: rgba(255, 255, 255, 0.75);
        padding: 1px 6px;
        border-radius: 4px;
        white-space: nowrap;
      }
      #bar {
        position: fixed;
        top: 8px;
        left: 8px;
        display: flex;
        gap: 6px;
        font-size: 13px;
      }
      #bar button {
        padding: 4px 10px;
      }
      #bar button.on {
        background: #11141d;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <div id="labels"></div>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
